[package]
name = "agentflow"
version = "0.1.0"
edition = "2021"
description = "Kết nối nhiều AI agent thành một pipeline xử lý task (researcher -> planner -> reviewer -> executor)"

[[bin]]
name = "agentflow"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15"
owo-colors = "4"
chrono = { version = "0.4", features = ["clock"] }
